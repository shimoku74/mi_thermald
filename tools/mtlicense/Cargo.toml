[package]
name = "mtlicense"
version = "0.1.0"
edition = "2021"

# Offline licensing tool for the paid ROM: keygen + per-device license issue.
# The private key NEVER ships in the ROM — only the 32-byte public key is
# embedded into the checker/kernel.

[[bin]]
name = "mtlicense"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
